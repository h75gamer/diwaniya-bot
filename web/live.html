<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>فعالية مباشرة 🔴 | ديوانية</title>
<meta name="description" content="فعاليات مباشرة لسيرفر الديوانية — هاتف خربان، خمّن الرسمة، مسابقات — بدون تسجيل دخول">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a1f;--bg2:#151033;--card:#1c1640;--card2:#241d52;--line:#2f2768;--gold:#f5b942;--gold2:#ffd77a;--text:#f3efff;--muted:#a99fd6;--good:#3ddc97;--bad:#ff5d73;--violet:#8b6cff;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 80% -10%,#3a2a8a55,transparent 55%),radial-gradient(ellipse at 10% 110%,#f5b94222,transparent 50%),var(--bg)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
input{font-family:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:14px;font-weight:800;font-size:16px;transition:.15s}
.btn.gold{background:linear-gradient(135deg,var(--gold),#e89b1c);color:#1b1300;box-shadow:0 8px 24px #f5b94244}
.btn.gold:hover{transform:translateY(-2px)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--card2)}
.btn.red{background:#3a1622;border:1px solid #6b2338;color:#ffb3c0}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.inp{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 16px;color:var(--text);font-size:17px;outline:none;width:100%}
.inp:focus{border-color:var(--gold)}
header{position:sticky;top:0;z-index:20;background:#0d0a1fdd;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .in{max-width:1300px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-weight:900;font-size:19px;display:flex;align-items:center;gap:8px}
.live{display:inline-flex;align-items:center;gap:6px;background:#3a1622;color:#ff8fa3;border:1px solid #6b2338;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:800}
.live i{width:8px;height:8px;border-radius:50%;background:#ff5d73;box-shadow:0 0 8px #ff5d73;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.3}}
header .sp{flex:1}
.code{font-weight:900;letter-spacing:3px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 12px;direction:ltr}
.mebox{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:14px}
.av{width:30px;height:30px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:14px;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.layout{max-width:1300px;margin:auto;display:grid;grid-template-columns:250px 1fr 300px;gap:14px;padding:14px 16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{font-size:15px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.plist{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
.pl{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;background:var(--bg2);font-size:15px}
.pl.me{outline:1px solid var(--gold)}
.pl.away{opacity:.45}
.pl .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.pl .sc{font-weight:900;color:var(--gold2)}
.pl .tag{font-size:12px}
.pl.done{background:#14382c}
.stage{min-height:520px;display:flex;flex-direction:column;gap:14px}
.timer{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.timer b{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--good));width:100%;transition:width .25s linear}
.topline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topline .t{font-weight:900;font-size:20px}
.secs{margin-inline-start:auto;font-weight:900;font-size:22px;color:var(--gold2);min-width:48px;text-align:center;background:var(--bg2);border-radius:12px;padding:0 10px}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;justify-content:center;flex:1;padding:20px}
.big{font-size:clamp(26px,4vw,40px);font-weight:900;line-height:1.3}
.muted{color:var(--muted)}
.chat{display:flex;flex-direction:column;height:100%;min-height:420px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;max-height:62vh;padding-inline-end:4px}
.msg{font-size:14.5px;padding:4px 8px;border-radius:10px;background:var(--bg2);word-break:break-word}
.msg b{color:var(--gold2)}
.msg.sys{background:none;color:var(--muted);font-size:13.5px;padding:2px 6px}
.msg.good{color:var(--good);font-weight:800}
.msg.priv{color:#ffb35d;font-weight:800}
.chatf{display:flex;gap:6px;margin-top:8px}
.chatf .inp{padding:9px 12px;font-size:15px}
/* لوحة الرسم */
.board{position:relative;width:100%;max-width:720px;margin:auto;aspect-ratio:4/3;background:#fff;border-radius:14px;overflow:hidden;touch-action:none;box-shadow:0 10px 30px #0006}
.board canvas{width:100%;height:100%;display:block;touch-action:none}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;max-width:720px;margin:auto}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff3;cursor:pointer}
.sw.on{outline:3px solid var(--gold);outline-offset:2px}
.tool{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:800;font-size:14px}
.tool.on{background:var(--gold);color:#1b1300}
.prompt{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 18px;font-size:20px;font-weight:800;text-align:center}
.prompt img{max-width:100%;border-radius:12px;background:#fff;display:block;margin:auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opt{padding:18px 14px;border-radius:16px;font-size:19px;font-weight:800;color:#fff;min-height:74px;transition:.12s;position:relative}
.opt:hover{transform:scale(1.02)}
.opt.c0{background:#e2405e}.opt.c1{background:#2f7de1}.opt.c2{background:#e0a41c}.opt.c3{background:#22a868}
.opt.dim{opacity:.35}.opt.ok{outline:4px solid #fff;opacity:1}
.opt .cnt{position:absolute;top:6px;left:10px;font-size:14px;background:#0005;border-radius:8px;padding:0 8px}
.word{direction:rtl;font-size:clamp(26px,4vw,38px);font-weight:900;letter-spacing:6px}
.word.full{letter-spacing:0}
.tapzone{flex:1;min-height:380px;border-radius:22px;display:grid;place-items:center;font-size:clamp(30px,6vw,56px);font-weight:900;user-select:none;cursor:pointer;transition:background .05s}
.tapzone.wait{background:#5a1a2a}.tapzone.go{background:#1d9a5c}.tapzone.idle{background:var(--card2)}
.album{display:flex;flex-direction:column;gap:12px;max-width:640px;margin:auto;width:100%}
.ent{display:flex;gap:10px;align-items:flex-start;animation:pop .4s both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.ent .who{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:2px}
.bubble{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:10px 16px;font-size:19px;font-weight:800}
.drawing{position:relative;display:inline-block;width:100%;max-width:520px}
.drawing img{width:100%;border-radius:14px;background:#fff;display:block}
.like{position:absolute;bottom:8px;left:8px;background:#000a;border-radius:99px;padding:4px 12px;font-weight:900;color:#fff}
.like.on{background:#e2405e}
.podium{display:flex;gap:12px;align-items:flex-end;justify-content:center;margin:10px 0}
.pod{background:var(--card2);border:1px solid var(--line);border-radius:16px 16px 6px 6px;padding:12px 8px;width:min(130px,29vw);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.pod .m{font-size:36px}.pod .n{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pod .s{color:var(--gold2);font-weight:900}
.pod .n{max-width:100%}
.pod.p1{min-height:190px;border-color:var(--gold)}.pod.p2{min-height:160px}.pod.p3{min-height:140px}
.rows{width:100%;max-width:520px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;background:var(--bg2);border-radius:12px;padding:8px 14px;font-weight:700}
.row.me{outline:1px solid var(--gold)}
.hostbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.note{background:#241d52;border:1px dashed var(--line);border-radius:14px;padding:10px 14px;color:var(--muted);font-size:14px}
.join{max-width:460px;margin:60px auto;text-align:center;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 20px;border-radius:14px;font-weight:800;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.grid-p{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:640px}
.grid-p .pl{min-width:150px}
@media(max-width:600px){header .in{gap:8px;padding:8px 10px}.mebox span:last-child{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.live{display:none}.layout{padding:10px 8px}.opt{font-size:16px;padding:14px 10px;min-height:60px}}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.plist{max-height:none;flex-direction:row;flex-wrap:wrap}.plist .pl{flex:1 1 140px}.msgs{max-height:240px}.chat{min-height:0}.side-p{order:2}.side-c{order:3}}
</style>
</head>
<body>
<header><div class="in">
  <a class="brand" href="/">🌙 ديوانية</a>
  <span class="live"><i></i> مباشر</span>
  <span class="sp"></span>
  <span class="code" id="hcode" hidden></span>
  <span class="mebox" id="hme"></span>
</div></header>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const qs = new URLSearchParams(location.search);
let R = (qs.get('r') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
let T = qs.get('t') || '';
let PID = null, since = 0, off = 0, S = null, key = '', polling = false;
let chatSeen = 0;
let strokeCache = { turnId: -1, ops: [] };
const app = $('#app');

function toast(t, ms = 1800) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), ms); }
const now = () => Date.now() + off;
const left = (dl) => Math.max(0, dl - now());
const img = (id) => `/api/live/img?r=${R}&id=${encodeURIComponent(id)}`;
const avatar = (p) => p.avatar ? `<span class="av"><img src="${esc(p.avatar)}" alt=""></span>` : `<span class="av">${esc((p.name || '؟')[0])}</span>`;

async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok) j.error = j.error || 'صار خطأ 😓';
  return j;
}
const act = (a, extra = {}) => post('/api/live/act', { r: R, p: PID, a, ...extra });

// ───────── الدخول ─────────
async function boot() {
  if (!R) {
    const c = await fetch('/api/live/current').then((r) => r.json()).catch(() => ({}));
    app.innerHTML = `<div class="join panel">
      <div class="big">🎮 الفعاليات المباشرة</div>
      ${c.room ? `<div class="note">🔴 فيه فعالية شغالة الحين: <b>${esc(c.room.title)}</b> (${c.room.players} لاعب)</div>
        <a class="btn gold" href="/live?r=${esc(c.room.code)}">ادخلها الحين 🚀</a>` : '<p class="muted">ما فيه فعالية مباشرة الحين 😴<br>تابع روم الشات بالديسكورد — صاحب السيرفر يعلن عنها هناك</p>'}
      <div class="muted">أو اكتب رمز الغرفة:</div>
      <input class="inp" id="codeIn" maxlength="4" placeholder="مثال: K7QP" style="text-align:center;letter-spacing:6px;direction:ltr;text-transform:uppercase">
      <button class="btn ghost" id="codeGo">دخول</button>
      <a class="btn ghost sm" href="/">⬅️ ارجع للموقع</a></div>`;
    $('#codeGo').onclick = () => { const v = $('#codeIn').value.trim().toUpperCase(); if (v) location.href = `/live?r=${encodeURIComponent(v)}`; };
    $('#codeIn').onkeydown = (e) => { if (e.key === 'Enter') $('#codeGo').click(); };
    return;
  }
  $('#hcode').hidden = false; $('#hcode').textContent = R;
  PID = localStorage.getItem(`dwlive_pid_${R}`);
  if (T) return join();
  if (PID) return join();
  const nick = localStorage.getItem('dw_nick') || '';
  app.innerHTML = `<div class="join panel">
    <div class="big">🎮 فعالية مباشرة</div>
    <div class="muted">غرفة <b class="code">${esc(R)}</b></div>
    <input class="inp" id="nm" maxlength="20" placeholder="اكتب اسمك (لقبك)" value="${esc(nick)}">
    <button class="btn gold" id="go">يلا ندخل 🚀</button>
    <div class="note">🪙 تبي <b>كوينز</b> لو فزت؟ ادخل من زر <b>«خذ رابطك»</b> اللي في إعلان الفعالية بالديسكورد</div></div>`;
  $('#nm').focus();
  $('#go').onclick = () => { const n = $('#nm').value.trim(); if (!n) return $('#nm').classList.add('shake'); localStorage.setItem('dw_nick', n); join(n); };
  $('#nm').onkeydown = (e) => { if (e.key === 'Enter') $('#go').click(); };
}
async function join(name) {
  app.innerHTML = '<div class="join"><div class="big">⏳</div><div class="muted">لحظة ندخلك...</div></div>';
  const j = await post('/api/live/join', { r: R, t: T || undefined, pid: PID || undefined, name: name || localStorage.getItem('dw_nick') || '' });
  if (j.error) {
    if (PID && !T) { localStorage.removeItem(`dwlive_pid_${R}`); PID = null; return boot(); }
    app.innerHTML = `<div class="join panel"><div class="big">😅</div><div>${esc(j.error)}</div><a class="btn ghost" href="/live">الفعاليات</a><a class="btn ghost" href="/">ارجع للموقع</a></div>`;
    return;
  }
  PID = j.pid;
  localStorage.setItem(`dwlive_pid_${R}`, PID);
  if (T) { T = ''; history.replaceState(null, '', `/live?r=${R}`); }
  buildLayout();
  loop();
}

function buildLayout() {
  app.innerHTML = `<div class="layout">
    <div class="panel side-p"><h3><span>👥 اللاعبين</span><span id="pc"></span></h3><div class="plist" id="plist"></div></div>
    <div class="panel stage" id="stage"></div>
    <div class="panel side-c chat"><h3><span>💬 الشات</span></h3><div class="msgs" id="msgs"></div>
      <form class="chatf" id="chatf"><input class="inp" id="chatin" maxlength="120" autocomplete="off" placeholder="اكتب..."><button class="btn gold sm">↩</button></form></div>
  </div>`;
  $('#chatf').onsubmit = async (e) => {
    e.preventDefault();
    const t = $('#chatin').value.trim(); if (!t) return;
    $('#chatin').value = '';
    const j = await act('chat', { text: t });
    if (j.error) toast(j.error);
  };
}

async function loop() {
  if (polling) return; polling = true;
  let fails = 0;
  while (true) {
    try {
      const r = await fetch(`/api/live/poll?r=${R}&p=${PID}&since=${since}`, { cache: 'no-store' });
      if (r.status === 410) { localStorage.removeItem(`dwlive_pid_${R}`); PID = null; polling = false; return boot(); }
      if (r.status === 404) { const j = await r.json().catch(() => ({})); stageEnd404(j.error); polling = false; return; }
      const j = await r.json();
      fails = 0;
      off = j.now - Date.now();
      since = j.seq;
      apply(j);
    } catch { fails++; await new Promise((res) => setTimeout(res, Math.min(5000, 800 * fails))); }
  }
}
function stageEnd404(msg) {
  app.innerHTML = `<div class="join panel"><div class="big">🏁</div><div>${esc(msg || 'الفعالية خلصت')}</div><a class="btn gold" href="/">ارجع للموقع</a></div>`;
}

// ───────── تطبيق التحديثات ─────────
function apply(j) {
  S = j.st;
  renderMe(); renderPlayers();
  for (const m of j.chat) addMsg(m);
  const fresh = [];
  if (S.type === 'draw' && S.phase === 'play' && S.g) {
    if (S.g.turnId !== strokeCache.turnId) strokeCache = { turnId: S.g.turnId, ops: [] };
    for (const s of j.strokes) for (const o of s.ops) { strokeCache.ops.push(o); fresh.push(o); }
  }
  const k = screenKey();
  if (k !== key) { key = k; buildScreen(); } else { updateScreen(); if (boardV) for (const o of fresh) boardV.add(o, false); }
  updateChatMode();
}
function renderMe() {
  const m = S.me;
  $('#hme').innerHTML = `${avatar(m)}<span>${esc(m.name)}${m.host ? ' 👑' : ''}${m.linked ? ' 🔗' : ''}</span>`;
}
function renderPlayers() {
  const el = $('#plist'); if (!el) return;
  $('#pc').textContent = S.players.length;
  const showScore = S.phase !== 'lobby';
  el.innerHTML = S.players.map((p) => `<div class="pl ${p.me ? 'me' : ''} ${p.away ? 'away' : ''} ${p.done ? 'done' : ''}">${avatar(p)}<span class="nm">${esc(p.name)}</span>
    <span class="tag">${p.host ? '👑' : ''}${p.linked ? '🔗' : ''}${p.spec ? '👀' : ''}${p.done ? '✅' : ''}</span>${showScore ? `<span class="sc">${p.score}</span>` : ''}</div>`).join('');
}
function addMsg(m) {
  if (m.seq <= chatSeen) return; chatSeen = m.seq;
  const box = $('#msgs'); if (!box) return;
  const d = document.createElement('div');
  const good = m.sys && /^(✅|⚡)/.test(m.text);
  d.className = `msg ${m.sys ? 'sys' : ''} ${good ? 'good' : ''} ${m.priv ? 'priv' : ''}`;
  d.innerHTML = m.sys ? esc(m.text) : `<b>${esc(m.name)}${m.host ? ' 👑' : ''}:</b> ${esc(m.text)}`;
  const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.appendChild(d);
  while (box.children.length > 150) box.firstChild.remove();
  if (stick) box.scrollTop = box.scrollHeight;
}
function updateChatMode() {
  const inp = $('#chatin'); if (!inp) return;
  const g = S.g;
  if (S.phase === 'play' && S.type === 'draw' && g?.sub === 'draw') {
    inp.placeholder = g.me ? 'أنت ترسم 🎨' : g.got ? 'عرفتها ✅' : 'اكتب تخمينك هنا 👈';
    inp.disabled = g.me || g.got;
  } else { inp.placeholder = 'اكتب...'; inp.disabled = false; }
}

function screenKey() {
  const g = S.g || {};
  if (S.phase !== 'play') return `${S.phase}`;
  if (S.type === 'phone') return `phone|${g.stage}|${g.step}|${g.submitted ? 1 : 0}|${g.spec ? 1 : 0}|${g.i}`;
  if (S.type === 'draw') return `draw|${g.turnId}|${g.sub}|${g.me ? 1 : 0}`;
  if (S.type === 'quiz') return `quiz|${g.qi}|${g.sub}|${g.my ? 1 : 0}`;
  if (S.type === 'race') return `race|${g.qi}|${g.sub}|${g.my != null ? 1 : 0}`;
  if (S.type === 'tap') return `tap|${g.r}|${g.sub}|${g.my != null || g.early ? 1 : 0}`;
  return 'x';
}

// ───────── المؤقت ─────────
let tmr = { dl: 0, total: 1 };
function timerHTML(title) { return `<div class="topline"><span class="t">${title}</span><span class="secs" id="secs"></span></div><div class="timer"><b id="tbar"></b></div>`; }
function setTimer(dl) { if (dl !== tmr.dl) { tmr = { dl, total: Math.max(1000, left(dl)) }; } }
setInterval(() => {
  const s = $('#secs'), b = $('#tbar');
  if (S && S.phase === 'lobby') { const el = $('#lobbyT'); if (el) { const l = Math.ceil(left(S.startAt) / 1000); el.textContent = l > 0 ? `${Math.floor(l / 60)}:${String(l % 60).padStart(2, '0')}` : '...'; } }
  if (!s || !tmr.dl) return;
  const l = left(tmr.dl);
  s.textContent = Math.ceil(l / 1000);

    ops.push(o);
    if (o.k === 'l') line(o); else if (o.k === 'f') fill(o); else redraw();
    if (local && net) net(o);
  }
  const api = { add, export: () => cv.toDataURL('image/jpeg', 0.82), reset: () => { ops = []; clear(); } };
  if (!editable) return api;

  const tools = $('#tools');
  tools.querySelectorAll('.sw').forEach((s) => s.onclick = () => { tools.querySelectorAll('.sw').forEach((x) => x.classList.remove('on')); s.classList.add('on'); color = s.dataset.c; if (tool === 'erase') { tool = 'pen'; tools.querySelector('[data-t=erase]').classList.remove('on'); } });
  tools.querySelectorAll('[data-w]').forEach((b) => b.onclick = () => { tools.querySelectorAll('[data-w]').forEach((x) => x.classList.remove('on')); b.classList.add('on'); width = Number(b.dataset.w); });
  tools.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => {
    const t = b.dataset.t;
    if (t === 'undo') return add({ k: 'u' }, true);
    if (t === 'clear') return add({ k: 'c' }, true);
    const on = tool !== t; tool = on ? t : 'pen';
    tools.querySelectorAll('[data-t=fill],[data-t=erase]').forEach((x) => x.classList.toggle('on', x.dataset.t === tool));
  });
  const pt = (e) => { const r = cv.getBoundingClientRect(); return [Math.round(((e.clientX - r.left) / r.width) * 1000), Math.round(((e.clientY - r.top) / r.height) * 750)]; };
  let cur = null, lastSent = 0;
  cv.onpointerdown = (e) => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    const [x, y] = pt(e);
    sid++;
    if (tool === 'fill') return add({ k: 'f', c: color, s: sid, x, y }, true);
    cur = { k: 'l', c: tool === 'erase' ? '#ffffff' : color, w: tool === 'erase' ? Math.max(width, 20) : width, s: sid, p: [x, y] };
    line(cur); lastSent = 0;
  };
  cv.onpointermove = (e) => {
    if (!cur) return;
    const [x, y] = pt(e);
    const p = cur.p; const lx = p[p.length - 2], ly = p[p.length - 1];
    if (Math.abs(x - lx) + Math.abs(y - ly) < 3) return;
    p.push(x, y);
    line({ ...cur, p: [lx, ly, x, y] });
    if (net && p.length - lastSent >= 40) { const chunk = { ...cur, p: p.slice(Math.max(0, lastSent - 2)) }; ops.push(chunk); net(chunk); lastSent = p.length; }
  };
  const up = () => {
    if (!cur) return;
    const p = cur.p;
    if (net) { if (lastSent < p.length) { const chunk = { ...cur, p: p.slice(Math.max(0, lastSent - 2)) }; ops.push(chunk); net(chunk); } }
    else ops.push(cur);
    cur = null;
  };
  cv.onpointerup = up; cv.onpointercancel = up; cv.onpointerleave = up;
  return api;
}

boot();
</script>
